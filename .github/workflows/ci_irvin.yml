name: CI/CD Validador de correos - Irvin Mejía

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de Irvin
        run: python -m pip install -r requirements_irvin.txt
      - name: Ejecutar pruebas de Irvin
        run: python -m pytest -v test_validador_irvin.py

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simular despliegue a producción
        run: |
          echo "Desplegando a producción..."
          echo "Versión lista para usar."
